<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; background: transparent; }
        body { display: flex; align-items: flex-end; justify-content: flex-end; padding: 52px 24px; }
        button {
            padding: 10px 16px;
            border: 1px solid rgba(255, 255, 255, .28);
            border-radius: 8px;
            background: rgba(18, 18, 20, .9);
            color: white;
            font: 600 14px -apple-system, BlinkMacSystemFont, sans-serif;
            box-shadow: 0 4px 18px rgba(0, 0, 0, .35);
            cursor: pointer;
        }
        button:hover, button:focus-visible { background: rgba(48, 48, 52, .95); outline: none; }
    </style>
</head>
<body>
    <button type="button" data-clickable>Skip Intro</button>
    <script>
        document.querySelector("button").addEventListener("click", () => {
            iina.postMessage("skipIntro", {});
        });
    </script>
</body>
</html>
