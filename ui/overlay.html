<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; background: transparent; }
        button {
            position: fixed;
            right: 120px;
            bottom: 120px;
            padding: 13px 24px;
            border: 0;
            border-radius: 999px;
            background: #fff;
            color: #000;
            font: 600 20px -apple-system, BlinkMacSystemFont, sans-serif;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
            cursor: pointer;
        }
        button:active { transform: scale(.98); }
        button:focus-visible { outline: 2px solid #000; outline-offset: -4px; }
    </style>
</head>
<body>
    <button type="button" data-clickable>Skip Intro</button>
    <script>
        const button = document.querySelector("button");
        iina.onMessage("setAction", (data) => {
            button.textContent = data?.label || "Skip Intro";
        });
        button.addEventListener("click", () => iina.postMessage("overlayAction", {}));
    </script>
</body>
</html>
