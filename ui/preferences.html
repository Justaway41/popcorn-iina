<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popcorn for IINA Preferences</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; }
        .addon-form { display: grid; gap: 6px; }
        .addon-presets { display: flex; flex-wrap: wrap; gap: 6px; }
        .addon-entry { display: flex; gap: 6px; }
        .addon-entry input { min-width: 0; flex: 1; }
        .addon-entry button { flex: none; }
        .addon-error { margin: 0; color: #d83b3b; font-size: 11px; }
        .addon-list { display: grid; gap: 5px; margin-top: 10px; }
        .addon-row {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto auto;
            align-items: center;
            gap: 8px;
            padding: 7px 8px;
            border: 1px solid rgba(128, 128, 128, .24);
            border-radius: 7px;
            background: rgba(128, 128, 128, .08);
        }
        .addon-copy { min-width: 0; }
        .addon-name, .addon-host { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .addon-name { font-weight: 600; }
        .addon-host { opacity: .62; font-size: 11px; }
        .addon-capabilities { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
        .addon-capabilities span {
            padding: 1px 5px;
            border-radius: 999px;
            background: rgba(128, 128, 128, .18);
            font-size: 9px;
        }
        .addon-url {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 10px;
        }
        .addon-url.is-blurred {
            filter: blur(4px);
            user-select: none;
        }
        .addon-reveal, .addon-remove { padding: 3px 7px; }
        .addon-empty { margin: 10px 0 0; opacity: .65; font-size: 11px; }
        .trakt-section { display: grid; gap: 6px; margin-top: 18px; }
        .trakt-section h3, .trakt-section p { margin: 0; }
        .trakt-links { display: flex; gap: 8px; }
        .trakt-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
        .trakt-device { padding: 7px 8px; border-radius: 7px; background: rgba(128,128,128,.1); }
    </style>
</head>
<body>
    <section class="pref-section">
        <form id="addon-form" class="addon-form">
            <label for="addon-url">Stremio addon manifest URL</label>
            <div class="addon-entry">
                <input id="addon-url" type="text" autocomplete="off"
                       placeholder="https://addon.example/manifest.json">
                <button id="add-addon" type="submit">Add Addon</button>
            </div>
            <p id="addon-error" class="addon-error" role="alert" hidden></p>
            <div class="addon-presets" aria-label="Recommended addons">
                <button class="addon-preset" type="button" data-name="TMDB"
                        data-url="https://94c8cb9f702d-tmdb-addon.baby-beamup.club/manifest.json">Add TMDB</button>
                <button class="addon-preset" type="button" data-name="Anime Kitsu"
                        data-url="https://anime-kitsu.strem.fun/manifest.json">Add Anime Kitsu</button>
            </div>
            <p class="small secondary pref-help">
                Enabled addons are searched together. Private URL details are blurred until you reveal them.
            </p>
        </form>
        <div id="addon-list" class="addon-list"></div>
        <p id="addon-empty" class="addon-empty">No addons yet.</p>
    </section>

    <section class="pref-section trakt-section" aria-labelledby="trakt-heading">
        <h3 id="trakt-heading">Trakt Sync</h3>
        <p class="small secondary pref-help">
            Create a Trakt application, then enter its Client ID and Client Secret.
        </p>
        <p class="small trakt-links">
            <a href="https://trakt.tv/join" data-external-url rel="noopener noreferrer">Create Trakt account</a>
            <a href="https://app.trakt.tv/settings/apps/api" data-external-url rel="noopener noreferrer">Create API app</a>
        </p>
        <label for="trakt-client-id">Client ID</label>
        <input id="trakt-client-id" type="text" autocomplete="off" spellcheck="false">
        <label for="trakt-client-secret">Client Secret</label>
        <input id="trakt-client-secret" type="password" autocomplete="off" spellcheck="false">
        <div class="trakt-actions">
            <button id="trakt-connect" type="button">Connect Trakt</button>
            <button id="trakt-sync" type="button" hidden>Sync Now</button>
            <button id="trakt-disconnect" type="button" hidden>Disconnect</button>
        </div>
        <p id="trakt-device" class="trakt-device" hidden></p>
        <p id="trakt-status" class="small secondary" role="status">Not connected</p>
        <p id="trakt-error" class="addon-error" role="alert" hidden></p>
    </section>

    <template id="addon-row-template">
        <div class="addon-row">
            <input class="addon-enabled" type="checkbox">
            <div class="addon-copy">
                <strong class="addon-name"></strong>
                <span class="addon-host"></span>
                <span class="addon-capabilities" aria-label="Capabilities"></span>
                <span class="addon-url is-blurred" aria-hidden="true"></span>
            </div>
            <button class="addon-reveal" type="button">Reveal</button>
            <button class="addon-remove" type="button">Remove</button>
        </div>
    </template>

    <script src="dist/preferences.js"></script>
</body>
</html>
